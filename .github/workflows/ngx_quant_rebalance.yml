name: NGX Quant Engine — Automated Rebalance & Execution

on:
  schedule:
    # 10:30 AM WAT (UTC+1) = 09:30 AM UTC, Monday through Friday (Active NGX Continuous Trading)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicitly enables git push access for trade audit logs

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: 5. Restore Bamboo Session State
        uses: actions/cache@v4
        with:
          path: bamboo_session.json
          key: bamboo-session-${{ runner.os }}

      - name: 6. Execute Quantitative Pipeline & Headless Trade Bridge
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAMBOO_EMAIL: ${{ secrets.BAMBOO_EMAIL }}
          BAMBOO_PASSWORD: ${{ secrets.BAMBOO_PASSWORD }}
          BAMBOO_PIN: ${{ secrets.BAMBOO_PIN }}
        run: |
          python -c "
          import sys
          import os

          sys.path.insert(0, os.path.abspath('.'))

          import src.data_ingestion as di
          from src.predictive_models import run_predictive_pipeline
          from src.risk_portfolio import optimize_ngx_portfolio
          from src.execution_engine import calculate_ngx_order_lots, dispatch_rebalance_orders

          print('🚀 Running NGX Quantitative Automated Rebalancing...')

          # 1. Ingest Data
          ohlcv_dict, macro_df = di.fetch_all_ngx_data()
          
          # 2. Signals & Volatility Modeling
          signals = run_predictive_pipeline(ohlcv_dict)
          
          # 3. Risk Management & Portfolio Optimization (₦14,850 Bamboo Capital)
          portfolio_cap = 14850.0
          weights, prices = optimize_ngx_portfolio(signals, portfolio_cap)
          
          # 4. Share Lots & Headless Execution Bridge
          orders, req_cash = calculate_ngx_order_lots(weights, prices, portfolio_cap)
          summary = dispatch_rebalance_orders(orders, cash_buffer_ngn=portfolio_cap - req_cash)
          
          print('✅ Execution Summary:', summary)
          "

      - name: 7. Commit & Push Updated Trade Audit Log & Session
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ngx_trade_audit.csv bamboo_session.json || true
          git commit -m "auto: append timestamped trade execution audit log" || true
          git push || true

      - name: 8. Upload Debug Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: "*.png"
