name: NGX Quant Engine — Midnight Bamboo Telegram Alert

on:
  schedule:
    # 11:15 PM WAT (UTC+1) = 22:15 UTC, Sunday through Thursday (Ahead of Mon-Fri NGX Open)
    - cron: '15 22 * * 0-4'
  workflow_dispatch:

jobs:
  send-midnight-order-ticket:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Lightweight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance

      - name: 4. Compute Self-Funding Order Ticket & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nightly_ngx_telegram.py

      - name: 5. Commit & Push Updated Audit Ledger
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ngx_trade_audit.csv || true
          git commit -m "auto: log 12:00 AM WAT Bamboo order ticket" || true
          git push || true
 
