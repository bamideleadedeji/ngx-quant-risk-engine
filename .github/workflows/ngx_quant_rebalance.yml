name: NGX Quant Engine — Automated Rebalance & Execution

on:
  schedule:
    # 10:00 AM WAT (UTC+1) = 09:00 AM UTC, Monday through Friday
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: 5. Execute Quantitative Pipeline & Headless Trade Bridge
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAMBOO_EMAIL: ${{ secrets.BAMBOO_EMAIL }}
          BAMBOO_PASSWORD: ${{ secrets.BAMBOO_PASSWORD }}
          BAMBOO_PIN: ${{ secrets.BAMBOO_PIN }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')

          import src.data_ingestion as di
          from src.predictive_models import run_predictive_pipeline
          from src.risk_portfolio import optimize_ngx_portfolio
          from src.execution_engine import calculate_ngx_order_lots, dispatch_rebalance_orders

          # 1. Ingest Data
          if hasattr(di, 'fetch_all_ngx_data'):
              df_ohlcv, df_macro = di.fetch_all_ngx_data()
          elif hasattr(di, 'fetch_ngx_data'):
              df_ohlcv, df_macro = di.fetch_ngx_data()
          elif hasattr(di, 'ingest_ngx_data'):
              df_ohlcv, df_macro = di.ingest_ngx_data()
          else:
              df_ohlcv, df_macro = di.main()
          
          # 2. Predictive Signals & Volatility
          signals = run_predictive_pipeline(df_ohlcv)
          
          # 3. Portfolio Optimization (₦14,850 Balance)
          portfolio_cap = 14850.0
          weights, prices = optimize_ngx_portfolio(signals, portfolio_cap)
          
          # 4. Generate Lots & Execute Headless Bridge
          orders, req_cash = calculate_ngx_order_lots(weights, prices, portfolio_cap)
          summary = dispatch_rebalance_orders(orders, cash_buffer_ngn=portfolio_cap - req_cash)
          print('Execution Summary:', summary)
          "

      - name: 6. Commit & Push Updated Trade Audit Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ngx_trade_audit.csv || true
          git commit -m "auto: append timestamped trade execution audit log" || true
          git push
