name: NGX Quant Engine — Midnight Bamboo Email Alert

on:
  schedule:
    # 11:15 PM WAT (UTC+1) = 22:15 UTC, Sunday through Thursday (Ahead of Mon-Fri NGX Open)
    - cron: '15 22 * * 0-4'
  workflow_dispatch:

jobs:
  send-midnight-order-ticket:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Lightweight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: 4. Compute Self-Funding Order Ticket & Send Email Alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python nightly_ngx_telegram.py

      - name: 5. Commit & Push Updated Audit Ledgers & Portfolio State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          for f in ngx_trade_audit.csv ngx_portfolio_audit.csv ngx_portfolio_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "auto: log 12:00 AM WAT Bamboo order ticket & portfolio telemetry" || true
          git push || true
 
