name: NGX Quant Engine — Automated Rebalance & Execution

on:
  schedule:
    # 10:00 AM WAT (UTC+1) = 09:00 AM UTC, Monday through Friday
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # required so the audit-log commit can be pushed

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: 5. Diagnose Project Layout
        run: |
          echo "---- Repo root ----"
          ls -la
          echo "---- src/ contents ----"
          ls -la src/ || echo "ERROR: src/ directory not found"
          # Make sure src is a proper package
          touch src/__init__.py
          echo "---- Modules defining run_predictive_pipeline ----"
          grep -rn "def run_predictive_pipeline" . --include="*.py" || echo "Not found anywhere in repo"

      - name: 6. Execute Quantitative Pipeline & Headless Trade Bridge
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAMBOO_EMAIL: ${{ secrets.BAMBOO_EMAIL }}
          BAMBOO_PASSWORD: ${{ secrets.BAMBOO_PASSWORD }}
          BAMBOO_PIN: ${{ secrets.BAMBOO_PIN }}
        run: |
          python - <<'PYEOF'
          import sys
          import os
          import importlib
          import pkgutil

          # Guarantee project root is at top of module lookup path
          sys.path.insert(0, os.path.abspath('.'))

          import src
          import src.data_ingestion as di


          def find_function(func_name, preferred_modules=()):
              """Import func_name from a preferred module, else scan every module in src/."""
              for mod_name in preferred_modules:
                  try:
                      mod = importlib.import_module(mod_name)
                      if hasattr(mod, func_name):
                          return getattr(mod, func_name)
                  except ModuleNotFoundError:
                      pass
              for m in pkgutil.iter_modules(src.__path__):
                  try:
                      mod = importlib.import_module(f'src.{m.name}')
                  except Exception as e:
                      print(f'⚠️ Skipping src.{m.name}: {e}')
                      continue
                  if hasattr(mod, func_name):
                      print(f'ℹ️ Found {func_name} in src.{m.name}')
                      return getattr(mod, func_name)
              raise ImportError(
                  f"Could not find '{func_name}' in any module under src/. "
                  f"Available modules: {[m.name for m in pkgutil.iter_modules(src.__path__)]}"
              )


          run_predictive_pipeline = find_function(
              'run_predictive_pipeline',
              ('src.predictive_models', 'src.predictive_model', 'src.models', 'src.predictive')
          )
          optimize_ngx_portfolio = find_function(
              'optimize_ngx_portfolio', ('src.risk_portfolio',)
          )
          calculate_ngx_order_lots = find_function(
              'calculate_ngx_order_lots', ('src.execution_engine',)
          )
          dispatch_rebalance_orders = find_function(
              'dispatch_rebalance_orders', ('src.execution_engine',)
          )

          print('🚀 Running NGX Quantitative Automated Rebalancing...')

          # 1. Ingest Data
          if hasattr(di, 'fetch_all_ngx_data'):
              df_ohlcv, df_macro = di.fetch_all_ngx_data()
          elif hasattr(di, 'fetch_ngx_data'):
              df_ohlcv, df_macro = di.fetch_ngx_data()
          elif hasattr(di, 'ingest_ngx_data'):
              df_ohlcv, df_macro = di.ingest_ngx_data()
          else:
              df_ohlcv, df_macro = di.main()

          # 2. Predictive Signals & Volatility Modeling
          signals = run_predictive_pipeline(df_ohlcv)

          # 3. Portfolio Optimization (₦14,850 Bamboo Capital)
          portfolio_cap = 14850.0
          weights, prices = optimize_ngx_portfolio(signals, portfolio_cap)

          # 4. Generate Shares Lots & Execute Headless Bridge
          orders, req_cash = calculate_ngx_order_lots(weights, prices, portfolio_cap)
          summary = dispatch_rebalance_orders(orders, cash_buffer_ngn=portfolio_cap - req_cash)

          print('✅ Execution Summary:', summary)
          PYEOF

      - name: 7. Commit & Push Updated Trade Audit Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ngx_trade_audit.csv || true
          git commit -m "auto: append timestamped trade execution audit log" || true
          git push
