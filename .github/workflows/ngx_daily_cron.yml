name: NGX Quantitative Engine Daily Pipeline

on:
  schedule:
    # Runs Monday through Friday at 14:00 UTC (3:00 PM WAT - Post NGX Market Close)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  execute-ngx-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance arch statsmodels scikit-learn torch scipy requests streamlit plotly

      - name: 🚀 Run NGX Quantitative Engine & Audit Dispatch
        env:
          BROKER_API_KEY: ${{ secrets.BROKER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os
          import pandas as pd
          from src.data_ingestion import run_phase_1_pipeline, DEFAULT_NGX_WATCHLIST
          from src.feature_engineering import build_feature_matrix
          from src.models.econometric_volatility import fit_gjr_garch, forecast_volatility_horizon
          from src.models.deep_forecaster import train_lstm_forecaster, train_transformer_forecaster, generate_directional_signal_score
          from src.risk_engine import apply_ngx_liquidity_and_friction_filter, optimize_ngx_portfolio_weights
          from src.execution_engine import calculate_ngx_order_lots, dispatch_rebalance_orders

          print('=====================================================')
          print('🚀 STARTING DAILY NGX AUTOMATED QUANTITATIVE RUN')
          print('=====================================================')

          PORTFOLIO_CAPITAL = 10_000_000.0  # ₦10 Million Capital Base

          # 1. Data Ingestion
          raw_data = run_phase_1_pipeline(symbols=DEFAULT_NGX_WATCHLIST[:5])
          ohlcv_dict = raw_data['ohlcv_series']
          macro_df = raw_data['macro_indicators']

          signals_map = {}
          market_data_for_risk = {}
          latest_prices = {}

          # 2. Predictive Signal Generation
          for sym, df_ohlcv in ohlcv_dict.items():
              if df_ohlcv.empty:
                  continue
              feat_df = build_feature_matrix(df_ohlcv, macro_df)
              market_data_for_risk[sym] = df_ohlcv
              latest_prices[sym] = float(df_ohlcv['Close'].iloc[-1])

              _, cond_vol = fit_gjr_garch(feat_df['Log_Return'])
              vol_forecast = forecast_volatility_horizon(feat_df['Log_Return'], horizon_days=20)
              garch_vol_1d = vol_forecast['1D_predicted_vol_pct']

              _, lstm_pred = train_lstm_forecaster(feat_df['Log_Return'], epochs=10)
              _, trans_pred = train_transformer_forecaster(feat_df['Log_Return'], epochs=10)

              signal_res = generate_directional_signal_score(
                  returns=feat_df['Log_Return'],
                  garch_vol_pred=garch_vol_1d,
                  lstm_return_pred=lstm_pred,
                  transformer_return_pred=trans_pred
              )
              signals_map[sym] = signal_res

          # 3. Risk Optimization & Liquidity Screening
          eligible_tickers, rejections = apply_ngx_liquidity_and_friction_filter(market_data_for_risk, signals_map)

          returns_comb = pd.DataFrame({
              sym: market_data_for_risk[sym]['Close'].pct_change()
              for sym in eligible_tickers if sym in market_data_for_risk
          }).dropna()

          opt_results = optimize_ngx_portfolio_weights(
              eligible_tickers=eligible_tickers,
              returns_df=returns_comb,
              signal_scores=signals_map,
              portfolio_value_ngn=PORTFOLIO_CAPITAL,
              max_single_stock_weight=0.30,
              max_portfolio_var_pct=0.025
          )

          # 4. Order Generation & Audit Dispatch
          orders, req_cash = calculate_ngx_order_lots(
              target_weights=opt_results['stock_weights'],
              latest_prices=latest_prices,
              portfolio_value_ngn=PORTFOLIO_CAPITAL
          )

          summary = dispatch_rebalance_orders(orders, cash_buffer_ngn=opt_results['cash_buffer_ngn'])
          print(f'✅ RUN COMPLETE: Dispatched {summary[\"orders_count\"]} orders.')
          "

      - name: 💾 Commit & Push Updated Audit Logs (`ngx_trade_audit.csv`)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ngx_trade_audit.csv
          git diff-index --quiet HEAD || git commit -m "auto: update daily NGX trade audit ledger [skip ci]"
          git push

      - name: 📦 Upload Audit Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-daily-audit-log
          path: ngx_trade_audit.csv
